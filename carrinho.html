<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho de Compras - Hortifruti da LILI</title>
  <link rel="stylesheet" href="assets/css/carrinho.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand-logo">
        <i data-lucide="sprout" class="logo-icon"></i>
      </div>
      <nav class="nav-menu">
        <a href="index.html" class="nav-item">
          <i data-lucide="home"></i>
          <span>Início</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <h1>Hortifruti e Mercearia da LILI</h1>
        <div class="header-actions">
          <a href="carrinho.html" class="icon-btn active cart-icon-wrapper" title="Carrinho">
            <i data-lucide="shopping-cart"></i>
            <span class="cart-badge" id="cart-badge">0</span>
          </a>
          <div class="user-avatar" title="Hortifruti da Lili">
            <img src="assets/imagens/logo.png" alt="Logo">
          </div>
        </div>
      </header>

      <section class="cart-banner">
        <h2>Seu Carrinho de Compras</h2>
      </section>

      <div class="cart-layout">
        <div class="cart-items-list" id="cart-items-container">
          </div>

        <div class="order-summary-card">
          <h2>Resumo do Pedido</h2>
          
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="summary-subtotal">R$ 0,00</span>
          </div>
          
          <div class="summary-row">
            <span>Entrega</span>
            <span class="shipping-info">Calculado no checkout</span>
          </div>

          <div class="summary-divider"></div>

          <div class="summary-row total-row">
            <span>Total</span>
            <span id="summary-total">R$ 0,00</span>
          </div>

          <form method="get" action="finalizarpedido.html">
            <button type="submit" class="btn-checkout" id="btn-checkout">Finalizar Compra</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
  <script src="assets/js/carrinho.js"></script>
</body>
</html>
