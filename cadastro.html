<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="assets/css/cadastro.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="leaf-bg leaf-top-right"><i data-lucide="sprout"></i></div>
  <div class="leaf-bg leaf-bottom-left"><i data-lucide="leaf"></i></div>

  <main class="signup-container">
    
    <div class="logo-wrapper">
      <img src="assets/imagens/logo.png" alt="Hortifruti da LiLi e Mercearia" class="logo-img">
    </div>

    <h1 class="title">Crie sua Conta</h1>

    <form class="signup-form" method="get" action="login.html">
      
      <div class="input-group">
        <input type="text" id="nome" required placeholder=" ">
        <label for="nome">Nome Completo</label>
      </div>

      <div class="input-group">
        <input type="text" id="cpf" required placeholder=" " maxlength="14">
        <label for="cpf">CPF</label>
      </div>

      <div class="input-group">
        <input type="email" id="email" required placeholder=" ">
        <label for="email">E-mail</label>
      </div>

      <div class="input-group">
        <input type="tel" id="telefone" required placeholder=" " minlength="11" maxlength="11">
        <label for="telefone">Telefone</label>
      </div>

      <div class="input-group">
        <input type="password" id="senha" required placeholder=" " minlength="8">
        <label for="senha">Senha</label>
      </div>

      <div class="login-redirect">
        <span>Já tem uma conta?</span>
        <a href="login.html" class="link">Acesse aqui</a>
      </div>

      <button type="submit" class="btn-submit">
        <span>Cadastrar</span>
        <a href="login.html" class="link"></a>
      </button>

    </form>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
